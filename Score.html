<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow</title>
    <script>document.documentElement.classList.add('auth-pending')</script>
    <link rel="stylesheet" href="HW.css">
</head>
<body>
    <h1 id="Header">StudyFlow</h1>

    <nav class="navbar">
        <ul>
            <li><a href="index.html">หน้าหลัก</a></li>
            <li><a href="HW.html">จัดการบ้าน</a></li>
            <li><a href="Settings.html">ตั้งค่า</a></li>
        </ul>
    </nav>

    <nav class="navbar">
        <ul>
            <li><a href="HW.html">เพิ่มการบ้าน</a></li>
            <li><a href="Score.html">เพิ่มคะแนนสอบ</a></li>
            <li><a href="ViewHW.html">ดูการบ้าน</a></li>
        </ul>
    </nav>

    <main>
        <form id="homework-form">
            <label for="hw_name">ชื่อการสอบ*:</label>
            <input type="text" id="hw_name" name="hw_name" required><br><br>

            <label for="hw_type">ประเภท*:</label>
            <select id="hw_type" name="hw_type" required>
                <option value="" disabled selected>เลือกประเภทการสอบ</option>
                <option value="สอบ">สอบย่อย</option>
                <option value="รายงาน">สอบกลางภาค</option>
                <option value="อื่นๆ">อื่นๆ</option>
            </select><br><br>

            <label for="subject">รายวิชา*:</label>
            <select id="subject" name="subject" required>
                <option value="" disabled selected>เลือกรายวิชา</option>
                <option value="คณิตศาสตร์พื้นฐาน">คณิตศาสตร์พื้นฐาน ค31102</option>
                <option value="คณิตศาสตร์เพิ่มเติม">คณิตศาสตร์เพิ่มเติม ค31202</option>
                <option value="ภาษาไทยพื้นฐาน">ภาษาไทยพื้นฐาน ท31102</option>
                <option value="การเขียน">การเขียน ท30204</option>
                <option value="ภาษาอังกฤษพื้นฐาน">ภาษาอังกฤษพื้นฐาน อ31201</option>
                <option value="ภาษาอังกฤษเพื่อการสื่อสาร">ภาษาอังกฤษเพื่อการสื่อสาร อ31214</option>
                <option value="ภาษาอังกฤษในชีวิตประจำวัน">ภาษาอังกฤษในชีวิตประจำวัน อ31210</option>
                <option value="วิทยาศาสตร์">วิทยาศาสตร์ ว30121</option>
                <option value="สังคมศึกษา">สังคมศึกษา ส31103</option>
                <option value="ประวัติศาสตร์">ประวัติศาสตร์ ส31104</option>
                <option value="นาฎศิลป์">นาฎศิลป์ ศ31102</option>
                <option value="การบัญชี">การบัญชี ง31282</option>
                <option value="การออกแบบ">การออกแบบ ว31287</option>
                <option value="ภาษาจีน">ภาษาจีน จ31204</option>
                <option value="อื่นๆ">อื่นๆ</option>
            </select><br><br>

            <label for="test_date">วันสอบ:</label>
            <input type="date" id="test_date" name="test_date"><br><br>

            <label for="score">คะแนนสอบ:</label>
            <span class="score">
                <input type="number" id="score" name="score" min="0" max="100">
                <span aria-hidden="true">/</span>
                <input type="number" id="total_score" name="total_score" min="1" max="100">
            </span><br><br>

            <label for="notes" id="notes-label">โน้ตเพิ่มเติม:</label>
            <textarea id="notes" name="notes" rows="32" cols="90"></textarea><br><br>

            <input type="submit" value="เพิ่มคะแนนสอบ">
        </form>
        <p id="form-status" role="status" aria-live="polite"></p>
        <p>(* หมายถึงข้อมูลที่จำเป็นต้องกรอก)</p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-client.js" defer></script>
    <script src="studyflow-api.js" defer></script>
    <script src="auth-guard.js" defer></script>
    <script src="score-form.js" defer></script>
</body>
</html>
