<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow</title>
    <script>document.documentElement.classList.add('auth-pending')</script>
    <link rel="stylesheet" href="HW.css">
    <script src="theme.js?v=883f24b" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-client.js" defer></script>
    <script src="studyflow-api.js" defer></script>
    <script src="auth-guard.js" defer></script>
</head>
<body>
    <h1 id="Header">StudyFlow</h1>

    <nav class="navbar">
        <ul>
            <li><a href="index.html">หน้าหลัก</a></li>
            <li><a href="HW.html">จัดการบ้าน</a></li>
            <li><a href="Settings.html">ตั้งค่า</a></li>
        </ul>
    </nav>

    <nav class="navbar">
        <ul>
            <li><a href="HW.html">เพิ่มการบ้าน</a></li>
            <li><a href="Score.html">เพิ่มคะแนนสอบ</a></li>
            <li><a href="ViewHW.html">ดูการบ้าน</a></li>
        </ul>
    </nav>

    <main>
        <h2 style="margin-top: 0; margin-bottom: 0;">รายการการบ้าน</h2>
        <p id="status-message" role="status" aria-live="polite"></p>
        <div class="homework-table-toolbar">
            <label for="homework-sort">เรียงตาม</label>
            <select id="homework-sort">
                <option value="submitted">เวลาส่ง</option>
                <option value="created">เพิ่มล่าสุด</option>
                <option value="name">ชื่อ</option>
            </select>
            <span class="table-hint">คลิกหัวคอลัมน์เพื่อขยาย / คืนขนาดคอลัมน์</span>
        </div>
        <dialog id="edit-homework-dialog" class="edit-homework-dialog">
            <form id="edit-homework-form">
                <h3>แก้ไขการบ้าน</h3>
                <input type="hidden" id="edit-homework-id">
                <label for="edit-hw-name">ชื่อการบ้าน</label><input id="edit-hw-name" type="text" required>
                <label for="edit-hw-type">ประเภท</label>
                <select id="edit-hw-type" required><option>การบ้าน</option><option>งานกลุ่ม</option><option>รายงาน</option><option>อื่นๆ</option></select>
                <label for="edit-subject">รายวิชา</label><input id="edit-subject" type="text" required>
                <label for="edit-due-date">วันครบกำหนด</label><input id="edit-due-date" type="date">
                <label for="edit-notes">โน้ตเพิ่มเติม</label><textarea id="edit-notes" rows="4"></textarea>
                <div class="edit-homework-actions"><button type="button" id="cancel-edit-homework">ยกเลิก</button><button type="submit">บันทึกการแก้ไข</button></div>
            </form>
        </dialog>
        <div class="table-container">
            <table id="homework-table" border="2">
                <thead>
                    <tr>
                        <th align="center">ชื่อการบ้าน</th>
                        <th align="center">ประเภท</th>
                        <th align="center">รายวิชา</th>
                        <th align="center">วันครบกำหนด</th>
                        <th align="center">โน้ตเพิ่มเติม</th>
                        <th align="center">เวลาบันทึก / เสร็จ / ส่ง</th>
                        <th align="center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="homework-list"></tbody>
            </table>
        </div>
    </main>
    <script src="view-homework.js" defer></script>
</body>
</html>
